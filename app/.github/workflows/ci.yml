name: ci

on: [push, pull_request]

defaults:
  run:
    working-directory: app

jobs:
  quality-and-coverage:
    name: quality + full coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,ui,stata,rag,writing]"
      - run: python -m ruff check src tests
      - run: python -m mypy src
      - run: python -m coverage run --branch -m pytest -q
      - run: python -m coverage report

  security-privacy:
    name: security + privacy regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,ui,stata,rag,writing]"
      - run: >-
          python -m pytest -q
          tests/test_enforcer_contracts.py
          tests/test_tool_enforcer_paths.py
          tests/test_privacy_modes_ext.py
          tests/test_eval_privacy_telemetry.py
          tests/test_ledger_evidence_hardening.py

  product-eval:
    name: offline product scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,ui,stata,rag,writing]"
      - run: python -m stata_agent.eval --json
      - run: python -m pytest -q tests/test_product_eval.py

  wheel-smoke:
    name: wheel install + resource smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,ui,stata,rag,writing]"
      - run: python -m build --wheel
      - name: install wheel into an isolated target and check resources
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          python -m pip install --no-deps --target "$smoke_dir" dist/*.whl
          PYTHONPATH="$smoke_dir" python - <<'PY'
          from pathlib import Path
          import stata_agent.ui as ui

          assert ui._UI_DIR.joinpath("index.html").is_file()
          assert ui._UI_DIR.joinpath("app.js").is_file()
          assert ui._PACKAGE_SKILLS_DIR.joinpath("SKILL.md").is_file()
          print("wheel resources ok")
          PY
          PYTHONPATH="$smoke_dir" python -m stata_agent.eval --json
