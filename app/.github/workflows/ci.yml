name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,stata,rag,writing]"
      - run: pytest -q            # live 项(skipif)默认跳过；真环境用 secret 触发
