[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stata-agent"
version = "0.1.0"
description = "实证研究 agent —— 切片 0：无 Agent 事件内核（事件账本 + 领域 reducer + 权限/阶段最小）"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
stata = ["mcp>=2,<3"]
rag = ["pymupdf"]
writing = ["python-docx"]
ui = ["fastapi", "uvicorn[standard]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["tests", ".venv"]
