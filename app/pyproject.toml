[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stata-agent"
version = "0.1.0"
description = "实证研究 agent —— 切片 0：无 Agent 事件内核（事件账本 + 领域 reducer + 权限/阶段最小）"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0"]

[project.scripts]
stata-agent-eval = "stata_agent.eval.runner:main"

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7.6", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]
stata = ["mcp>=2,<3"]
rag = ["pymupdf"]
writing = ["python-docx"]
ui = ["fastapi", "uvicorn[standard]", "pymupdf", "python-docx", "mcp>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stata_agent = ["ui/*.html", "ui/*.css", "ui/*.js", "skills/*.md", "eval/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# This is an explicit migration baseline for the pre-productization tree.
# New files are linted by the critical E/F rules; these exceptions enumerate
# only legacy findings that are intentionally deferred instead of disabling
# Ruff globally.  Remove entries as the corresponding legacy modules are
# modernized.
[tool.ruff.lint.per-file-ignores]
"src/stata_agent/harness/context.py" = ["F541"]
"src/stata_agent/harness/recovery.py" = ["F401"]
"src/stata_agent/harness/research_turn.py" = ["F401"]
"src/stata_agent/providers/capabilities.py" = ["F401"]
"src/stata_agent/providers/contract.py" = ["F401"]
"src/stata_agent/runner.py" = ["E741"]
"src/stata_agent/toolkit.py" = ["F401"]
"src/stata_agent/tools/executor.py" = ["F401"]
"src/stata_agent/tools/robustness.py" = ["F401"]
"src/stata_agent/tools/stata_client.py" = ["F401"]
"src/stata_agent/tools/strategy.py" = ["F401"]
"src/stata_agent/writer/table.py" = ["E741", "F401"]
"tests/test_agent_loop.py" = ["F841"]
"tests/test_chain_invariants.py" = ["F401"]
"tests/test_compaction_memory.py" = ["E702", "F401"]
"tests/test_context_compaction_auto.py" = ["F841"]
"tests/test_e2e_full_pipeline.py" = ["F401"]
"tests/test_enforcer_contracts.py" = ["F401"]
"tests/test_executor_reuse.py" = ["F401"]
"tests/test_fence.py" = ["E702"]
"tests/test_privacy_modes_ext.py" = ["F401"]
"tests/test_rag_hybrid.py" = ["F401"]
"tests/test_reconcile_snapshot_upcast.py" = ["F401"]
"tests/test_runner.py" = ["E702", "F401"]
"tests/test_skill_evolve.py" = ["F401"]
"tests/test_skills_loader_ext.py" = ["F401"]
"tests/test_store_basics.py" = ["E702", "F401"]
"tests/test_strategy_ado.py" = ["F401"]
"tests/test_stream_chat.py" = ["E741", "F401"]
"tests/test_tool_enforcer_paths.py" = ["F401"]
"tests/test_toolkit_direct.py" = ["F401"]
"tests/test_writer_citation.py" = ["F401"]
"tests/test_writer_figure.py" = ["F401"]

[tool.coverage.run]
branch = true
source = ["src/stata_agent"]
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["tests", ".venv"]

# Explicit legacy baseline: these pre-productization modules contain known
# typing debt (mostly untyped FastAPI/transport adapters).  They stay named
# here so new and touched product/eval code remains checked by ``mypy src``;
# this is deliberately not a global ignore_errors escape hatch.  Remove a
# module from this list when its annotations are modernized.
[[tool.mypy.overrides]]
module = [
  "stata_agent.rag.retriever",
  "stata_agent.rag.hybrid",
  "stata_agent.rag.index",
  "stata_agent.writer.ground",
  "stata_agent.writer.table",
  "stata_agent.writer.draft_multi",
  "stata_agent.domain.reducers",
  "stata_agent.harness.research_turn",
  "stata_agent.harness.tool_enforcer",
  "stata_agent.harness.agent_loop",
  "stata_agent.cli",
  "stata_agent.ui",
  "stata_agent.tools.stata_client",
  "stata_agent.tools.executor",
]
ignore_errors = true
